      <stop offset="0" stop-color="#8538DE"/>
      <stop offset="1" stop-color="#397FAC"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 64) scale(0.5)">
  <g fill="none" stroke-width="22" stroke-linecap="round">

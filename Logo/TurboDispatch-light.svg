<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 256" role="img" aria-labelledby="title desc">
  <title id="title">TurboDispatch.jl</title>
  <desc id="desc">Binary dispatch tree with endpoints spaced 32 units horizontally and 64 units vertically.</desc>
  <style>@font-face { font-family: 'Turbo Mona Sans'; font-style: normal; font-weight: 700; src: url(data:font/woff2;base64,) format('woff2'); }</style>
  <defs>

  </g>
  <g>
    <circle cx="32" cy="128" r="16" fill="url(#tree-gradient)"/>
    <circle cx="144" cy="64" r="14" fill="url(#tree-gradient)"/>
    <circle cx="112" cy="192" r="14" fill="url(#tree-gradient)"/>
    <circle cx="320" cy="32" r="16" fill="url(#tree-gradient)"/>
    <circle cx="288" cy="96" r="16" fill="url(#tree-gradient)"/>
    <circle cx="256" cy="160" r="16" fill="url(#tree-gradient)"/>
    <circle cx="224" cy="224" r="16" fill="url(#tree-gradient)"/>
  </g>
  </g>
  <text class="wordmark" x="220" y="162" fill="#1e1e2e" font-family="'Turbo Mona Sans', 'Mona Sans', sans-serif" font-size="104" font-weight="700" letter-spacing="-2">Turbo<tspan fill="#397FAC">Dispatch.jl</tspan></text>
</svg>
